config:
  builder: docker
  workers: 3
  architectures:
    - linux/amd64
    - linux/arm64
  dockerfiles:
    source: examples/src
    destination: examples/build
  labels:
    maintainer: "your-team@company.com"
    project: "container-builder-example"

images:
  ubuntu22:
    version: 22.04.2
    base_image: ubuntu:22.04
    args:
      GH_VERSION: 2.76.2
    envs:
      DEBIAN_FRONTEND: noninteractive
    images:
      rust:
        dockerfile: Dockerfile.rust
        version: 1.89.0-4
        architectures:
          - linux/amd64
        args:
          RUST_VERSION: 1.89.0
        envs:
          RUST_LOG: info
        images:
          tauri:
            version: 2.0.0-4
            args:
              NODE_VERSION: 22
              NVM_VERSION: 0.40.3
            images:
              win:
                version: 2.0.0-5
                args:
                  DOTNET_VERSION: 8.0.100
      nodejs:
        version: 22.0.0-4
        args:
          NODE_VERSION: 22
          NVM_VERSION: 0.40.3